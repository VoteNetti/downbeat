repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--config=.gitleaks.toml]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(install\.sh|bootstrap\.sh|install/.*\.sh|scripts/.*\.sh|test/.*\.sh|home/\.local/bin/downbeat)$
        types: [shell]
