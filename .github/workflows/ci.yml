name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists the PR's commits

jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pre-commit
        run: pipx install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      # The pre-commit gitleaks hook only scans staged changes, so scan the commits with gitleaks-action here
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Skip the slow install test for changes that can't affect it (docs, changelog, ...).
  # The filter is a step-level `if:`, not a job-level one or workflow `paths:`: a skipped
  # matrix job never expands, so the required "install (<os>)" checks would never report
  # and the PR would wait on them forever. This way both checks always run and pass fast.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.filter.outputs.install }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            install:
              - install.sh
              - bootstrap.sh
              - Brewfile
              - install/**
              - home/**
              - .github/workflows/ci.yml

  install:
    name: install (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      DOWNBEAT_GITHUB_USER: VoteNetti
      DOWNBEAT_GIT_EMAIL: ci@example.com
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      # Pushes to main always run it, as a backstop for anything the filter misses
      RUN_INSTALL: ${{ github.event_name == 'push' || needs.changes.outputs.install == 'true' }}
    steps:
      - name: Skip (no install-related changes)
        if: env.RUN_INSTALL != 'true'
        run: echo "Nothing here affects the install; skipping."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_INSTALL == 'true'
      - name: Bootstrap from this commit
        if: env.RUN_INSTALL == 'true'
        # bootstrap.sh clones DOWNBEAT_REPO, so point it at the checkout instead of GitHub
        env:
          DOWNBEAT_REPO: ${{ github.workspace }}
        run: bash bootstrap.sh
      - name: Run install.sh again (idempotence)
        if: env.RUN_INSTALL == 'true'
        run: ~/.downbeat/install.sh
      - name: Check the result
        if: env.RUN_INSTALL == 'true'
        run: |
          set -euo pipefail
          # No 1Password on runners, so signing must be off
          test "$(git config --file ~/.gitconfig.local commit.gpgsign)" = "false"
          test "$(git config --file ~/.gitconfig.local user.email)" = "$DOWNBEAT_GIT_EMAIL"
          # Dotfiles are symlinks into the clone
          test "$(readlink ~/.zshrc)" = "$HOME/.downbeat/home/.zshrc"
          test -f ~/.downbeat/.git/hooks/pre-commit
